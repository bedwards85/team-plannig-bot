# Sample team: entirely fictional people, safe to keep in a public repo.
# For the real team, copy this to config/team.local.yaml (git-ignored) and
# point TEAM_CONFIG at it.

teamName: Fraud Analytics (sample team)

# What the team legitimately does, in a few sentences. The coach is given this
# (with the OKRs) so that the team's everyday vocabulary is read in context.
remit: >-
  An in-house fraud strategy and analytics team. Its job is to detect, measure
  and prevent fraud against the company and its customers: building risk scores,
  investigating suspicious accounts and devices, and reporting fraud losses.
  Everyday vocabulary here includes mule accounts, SIM-swap fraud, synthetic
  identities, account takeover, device tampering, fraud rings and chargebacks.

